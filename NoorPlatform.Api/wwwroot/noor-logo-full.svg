<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="منصة نور لإدارة مركز وحلقات تحفيظ القرآن الكريم">
  <defs>
    <linearGradient id="noorBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <mask id="crescentCut2">
      <rect width="200" height="200" fill="black"/>
      <circle cx="142" cy="96" r="34" fill="white"/>
    </mask>
  </defs>

  <!-- الشعار المصغر -->
  <g transform="translate(10,10)">
    <rect width="200" height="200" rx="48" fill="url(#noorBg2)"/>
    <rect x="10" y="10" width="180" height="180" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3"/>
    <g mask="url(#crescentCut2)">
      <circle cx="106" cy="106" r="54" fill="#ffffff"/>
    </g>
    <path d="M150 60 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#fde68a"/>
  </g>

  <!-- الاسم -->
  <text x="238" y="122" font-family="Tajawal, 'Segoe UI', Tahoma, Arial, sans-serif"
        font-size="74" font-weight="800" fill="url(#wordGrad)" direction="rtl" text-anchor="end">نور</text>
  <text x="240" y="162" font-family="Tajawal, 'Segoe UI', Tahoma, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#6b7280" direction="rtl" text-anchor="end">لإدارة مركز وحلقات تحفيظ القرآن الكريم</text>
  <line x1="238" y1="182" x2="700" y2="182" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
